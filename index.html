<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB Power</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f5; color: #18302b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { max-width: 850px; margin: 0 auto; padding: 54px 24px 72px; }
    .eyebrow { color: #458879; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(34px, 5vw, 52px); letter-spacing: -.045em; }
    .intro { color: #61726d; font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; color: #61726d; font-size: 13px; }
    .toolbar button { border: 0; background: transparent; color: #277b67; font-weight: 700; cursor: pointer; padding: 8px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card { background: white; border: 1px solid #e1e9e5; border-radius: 22px; padding: 26px; box-shadow: 0 10px 35px #163a3010; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    h2 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
    .badge { border-radius: 100px; background: #eaf0ed; padding: 7px 11px; font-size: 12px; font-weight: 800; }
    .badge.on { color: #087557; background: #dff7e9; }
    .badge.off { color: #8a5965; background: #fae9ed; }
    .state { margin: 24px 0 5px; font-size: 29px; font-weight: 800; letter-spacing: -.04em; }
    .hint { color: #74857e; font-size: 13px; margin: 0 0 26px; }
    .row { display: flex; gap: 9px; }
    button.action { flex: 1; border: 1px solid #d9e6df; border-radius: 12px; background: #f7faf8; color: #1d5848; padding: 12px 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button.action.primary { background: #08795c; color: white; border-color: #08795c; }
    button.action:disabled { opacity: .5; cursor: wait; }
    .divider { border-top: 1px solid #e9efec; margin: 26px 0 23px; }
    .cycle-title { font-size: 15px; font-weight: 800; margin: 0 0 5px; }
    .cycle-detail { color: #74857e; font-size: 13px; line-height: 1.5; margin: 0 0 17px; }
    .notice { margin-top: 22px; border: 1px solid #dce7e1; border-radius: 16px; padding: 16px 20px; color: #5d7068; font-size: 13px; line-height: 1.6; background: #f9fbf9; }
    #message { min-height: 22px; color: #1f7359; font-size: 13px; margin: 16px 0 0; }
    @media (max-width: 650px) { main { padding: 34px 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Local Mac control</div>
    <h1>USB Power</h1>
    <p class="intro">控制 USB-C 端口供电。周期充电由 macOS 定时任务执行，关掉这个页面也会继续。</p>
    <div class="toolbar"><span id="hub">正在读取设备…</span><button id="refresh" type="button">刷新状态</button></div>
    <div class="grid">
      <section class="card" data-port="1">
        <div class="card-header"><h2>端口 1</h2><span class="badge">读取中</span></div>
        <div class="state">—</div><p class="hint">手动控制</p>
        <div class="row"><button class="action primary" data-mode="power" data-action="on">通电</button><button class="action" data-mode="power" data-action="off">断电</button></div>
        <div class="divider"></div><p class="cycle-title">周期充电</p><p class="cycle-detail">通电 6 小时 · 断电 18 小时 · 每天循环</p>
        <div class="row"><button class="action primary" data-mode="cycle" data-action="on">开启周期</button><button class="action" data-mode="cycle" data-action="off">停止周期</button></div>
      </section>
      <section class="card" data-port="2">
        <div class="card-header"><h2>端口 2</h2><span class="badge">读取中</span></div>
        <div class="state">—</div><p class="hint">手动控制</p>
        <div class="row"><button class="action primary" data-mode="power" data-action="on">通电</button><button class="action" data-mode="power" data-action="off">断电</button></div>
        <div class="divider"></div><p class="cycle-title">周期充电</p><p class="cycle-detail">通电 6 小时 · 断电 18 小时 · 每天循环</p>
        <div class="row"><button class="action primary" data-mode="cycle" data-action="on">开启周期</button><button class="action" data-mode="cycle" data-action="off">停止周期</button></div>
      </section>
    </div>
    <p id="message" role="status"></p>
    <div class="notice">停止周期后，端口会保持通电。手动操作不会关闭已开启的周期；下次定时检查可能再次改变端口状态。固定时间策略不读取手机电量，Mac 关机或断电时无法保证手机持续有电。</div>
  </main>
  <script>
    const token = '__CSRF_TOKEN__';
    const message = document.querySelector('#message');
    function render(data) {
      document.querySelector('#hub').textContent = `USB hub: ${data.hub}`;
      for (const [port, item] of Object.entries(data.ports)) {
        const card = document.querySelector(`[data-port="${port}"]`);
        const badge = card.querySelector('.badge');
        badge.textContent = item.cycle === 'enabled' ? '周期已开启' : '周期未开启';
        badge.className = `badge ${item.cycle === 'enabled' ? 'on' : 'off'}`;
        card.querySelector('.state').textContent = item.power === 'on' ? '正在通电' : item.power === 'off' ? '已断电' : '状态未知';
        card.querySelector('.hint').textContent = item.error || '手动控制';
      }
    }
    async function refresh() {
      try {
        const response = await fetch('/api/status', {cache: 'no-store'});
        if (!response.ok) throw new Error('无法读取状态');
        render(await response.json());
      } catch (error) { message.textContent = error.message; }
    }
    document.querySelector('#refresh').addEventListener('click', refresh);
    document.querySelectorAll('button[data-action]').forEach(button => button.addEventListener('click', async () => {
      const port = button.closest('[data-port]').dataset.port;
      document.querySelectorAll('button[data-action]').forEach(item => item.disabled = true);
      message.textContent = '正在执行…';
      try {
        const response = await fetch('/api/action', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'X-USB-Power-Token': token},
          body: JSON.stringify({port, mode: button.dataset.mode, action: button.dataset.action})
        });
        const result = await response.json();
        message.textContent = result.message || result.error;
        if (result.status) render(result.status);
      } catch (error) { message.textContent = error.message; }
      finally { document.querySelectorAll('button[data-action]').forEach(item => item.disabled = false); }
    }));
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
